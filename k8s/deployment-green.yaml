apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-green
  labels:
    app: vle8-app
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8-app
      color: green
  template:
    metadata:
      labels:
        app: vle8-app
        color: green
    spec:
      containers:
        - name: web
          image: vle8-green:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
