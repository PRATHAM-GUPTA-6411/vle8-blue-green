apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-blue
  labels:
    app: vle8-app
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8-app
      color: blue
  template:
    metadata:
      labels:
        app: vle8-app
        color: blue
    spec:
      containers:
        - name: web
          image: vle8-blue:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
