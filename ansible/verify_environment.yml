
---
- name: Configure and verify VLE-8 DevOps environment
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:
    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Confirm Docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Confirm Git is installed
      ansible.builtin.command: git --version
      changed_when: false

    - name: Confirm kubectl is installed
      ansible.builtin.command: kubectl version --client
      changed_when: false

    - name: Confirm Terraform is installed
      ansible.builtin.command: terraform --version
      changed_when: false

    - name: Confirm Ansible is installed

      ansible.builtin.command: ansible --version
      changed_when: false

